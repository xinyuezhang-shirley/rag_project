[project]
name = "ai-data-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "xinyuezhang-shirley",email = "xinyuezhang.shirley@gmail.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.138.2,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "openai (>=2.46.0,<3.0.0)",
    "tiktoken (>=0.13.0,<0.14.0)",
    "sqlglot (>=30.14.0,<31.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "numpy (>=2.3,<3.0)",
    "pypdf (>=6.19.0,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "markdown (>=3.11,<4.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)"
]
